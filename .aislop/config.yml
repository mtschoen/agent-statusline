# aislop (AI-slop gate) config.
# CI builds the fork commit pinned in .aislop/fork-commit (`aislop ci .`).
# The fork supports per-rule severity overrides (rules: {"<rule>":
# error|warning|off}) plus exclude/include globs, engine toggles, and
# ci.failBelow -- but overrides are repo-wide, not per-file, so house
# policy is restructure-first (see AGENTS.md); none are set here.
#
# The two exceptions in the tree are inline `aislop-ignore-next-line` directives
# (the fork's own per-line suppression, narrower than a repo-wide rules: entry) on
# `import statusline` in kimi_statusline.py and qwen_statusline.py. The rule
# resolves local *packages* (directories with __init__.py) but not root-level
# top-level modules, so it reads a real sibling file as a missing pip package.
# There is no restructure short of turning the entry point into a package. Each
# site carries its rationale; see issue #23.
#
# failBelow is 90, `aislop ci .` runs in CI and exits non-zero below it.
# STANDING MARGIN WARNING: the repo scores 90 against a floor of 90 (headroom
# is exhausted). Seven files exceed the 400-line code-quality limit
# (pi-extension/renderer.ts, scripts/verify_badge.py,
# scripts/verify_beacon_walker.py, scripts/verify_fable_quota.py,
# scripts/verify_qwen_quota.py, statusline.py, and statusline_lib/pace.py)
# and those warnings cost ten points. Split those files (or make a deliberate
# call on the limit) before the next feature pushes the gate red again.
ci:
  failBelow: 90

