name: aislop
# Quality gate for AI-generated slop patterns (https://github.com/scanaislop/aislop).
# `aislop ci` scores the whole repo (0-100) and exits non-zero when the score
# drops below ci.failBelow (90) in .aislop/config.yml - gating the PR/push.
#
# We clone + build the mtschoen/aislop fork at the commit pinned in
# .aislop/fork-commit and run the built CLI. Gitea is the canonical source - the
# pin is bumped by pushes that land there first - and github.com/mtschoen/aislop
# is a mirror that can lag behind, so a freshly bumped sha may not exist on
# GitHub yet. The pin is bumped by the aislop fork's sync-consumers workflow via
# PR; a manual bump = edit .aislop/fork-commit directly.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read aislop fork pin
        # Pinned by commit, not a published version - the registry publish
        # route is retired. The pin is bumped by the aislop fork's
        # sync-consumers workflow via PR; a manual bump = edit
        # .aislop/fork-commit directly. .aislop/fork-commit is modified by
        # external bump PRs by design, so validate it is exactly one 40-char
        # lowercase hex sha before it reaches GITHUB_ENV - an unvalidated
        # write would let a crafted file with embedded newlines inject
        # arbitrary env vars into later steps.
        run: |
          commit=$(tr -d '[:space:]' < .aislop/fork-commit)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: .aislop/fork-commit is not a single 40-char lowercase sha" >&2
            exit 1
          fi
          echo "AISLOP_FORK_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Detect toolchain baked into the runner image
        id: baked
        shell: bash
        run: bash ci/baked-toolchain.sh node

      - uses: actions/setup-node@v4
        if: steps.baked.outputs.node != 'true'
        with:
          # Matches the fleet image's baked Node (24.22.0), which already
          # satisfies the fork's tsdown build floor (^22.18 || >=24.11).
          node-version: '24.22.0'
      - name: Build aislop (pinned fork commit)
        # Cloned outside the workspace so aislop does not scan the fork's own source.
        # From Gitea (canonical, always current), not the github.com mirror (can lag
        # behind by many commits, so a freshly bumped pin can be absent there).
        # The fork is a pnpm workspace; its package.json "packageManager" is the
        # only record of the pnpm version. The step reads that spec, activates it
        # through corepack (offline from the version the fleet image bakes), and
        # fails loudly if the active pnpm differs (no job-time npm download).
        env:
          COREPACK_ENABLE_NETWORK: '0'
          PNPM_STORE_DIR: /var/cache/fleet/pnpm
          npm_config_store_dir: /var/cache/fleet/pnpm
        run: |
          git clone https://gitea.fleet.sticktoitive.net/schoen/aislop.git "$RUNNER_TEMP/aislop"
          git -C "$RUNNER_TEMP/aislop" checkout "$AISLOP_FORK_COMMIT"
          corepack enable 2>/dev/null || true
          pnpm_spec="$(node -e '
            const fs = require("fs");
            const manifest = process.argv[1];
            let packageManager;
            try {
              packageManager = JSON.parse(fs.readFileSync(manifest, "utf8")).packageManager;
            } catch (err) {
              console.error("aislop: ERROR: cannot read packageManager from " + manifest + ": " + err.message);
              process.exit(1);
            }
            if (typeof packageManager !== "string" || !/^pnpm@\d+\.\d+\.\d+$/.test(packageManager)) {
              console.error("aislop: ERROR: " + manifest + " packageManager must look like pnpm@<major>.<minor>.<patch>, got " + JSON.stringify(packageManager));
              process.exit(1);
            }
            process.stdout.write(packageManager);
          ' "$RUNNER_TEMP/aislop/package.json")"
          pnpm_version="${pnpm_spec#pnpm@}"
          corepack prepare "$pnpm_spec" --activate 2>/dev/null || true
          test "$(pnpm --version)" = "$pnpm_version"
          (cd "$RUNNER_TEMP/aislop" && pnpm install --frozen-lockfile)
      - name: aislop quality gate
        # Sanity-fail if the scan didn't actually walk the repo (avoid a
        # silent pass on an empty/broken run): require a healthy file count
        # alongside the score gate, same guard shape as schoen-lab's
        # aislop.yml. This repo scans ~122 files today.
        run: |
          REPORT="$RUNNER_TEMP/aislop-report.json"
          node "$RUNNER_TEMP/aislop/dist/cli.js" ci . --json > "$REPORT" || GATE_FAILED=1
          node -e "const r=require(process.env.REPORT); const f=r.summary?.files??0; console.log('aislop score',r.score,'over',f,'files'); if(f<20){console.error('aislop only scanned '+f+' files - the scan did not run');process.exit(1);}"
          if [ -n "$GATE_FAILED" ]; then echo "GATE_STATE=failure" >> "$GITHUB_ENV"; echo "aislop score below failBelow"; exit 1; fi
          echo "GATE_STATE=success" >> "$GITHUB_ENV"
        env:
          REPORT: ${{ runner.temp }}/aislop-report.json

      - name: Post aislop score status
        # Surfaces the score in the PR's checks list (context aislop/score,
        # e.g. "score 90/100 over 122 files"), the way pr-crew/coverage shows
        # its percentage. GATE_STATE is unset when the gate step died before
        # the score check ran - default to failure so the status can never
        # show green without a gate run.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/post-aislop-status.py --report "$RUNNER_TEMP/aislop-report.json" --state "${GATE_STATE:-failure}"
