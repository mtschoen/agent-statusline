name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Pin-only PRs (a bump of .aislop/fork-commit, opened by the aislop fork's
      # sync-consumers workflow) don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (pin-only PR early exit)
        id: changed-files
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          PIN_ONLY=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
            if git fetch --depth=1 origin "$GITHUB_BASE_REF" 2>/dev/null; then
              CHANGED=$(git diff --name-only FETCH_HEAD HEAD 2>/dev/null || true)
              echo "Changed files vs $GITHUB_BASE_REF:"
              echo "$CHANGED"
              if [ "$CHANGED" = ".aislop/fork-commit" ]; then
                PIN_ONLY=true
              fi
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --depth=1 origin "$EVENT_BEFORE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" 2>/dev/null || true)
              echo "Changed files ($EVENT_BEFORE..$EVENT_AFTER):"
              echo "$CHANGED"
              if [ "$CHANGED" = ".aislop/fork-commit" ]; then
                PIN_ONLY=true
              fi
            fi
          fi
          echo "pin_only=$PIN_ONLY" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.changed-files.outputs.pin_only != 'true'
        with:
          python-version: '3.11'
      - name: Check syntax
        if: steps.changed-files.outputs.pin_only != 'true'
        run: python -m py_compile statusline.py subagent_statusline.py install.py wrap_nudge.py statusline_lib/*.py
      - name: Lint (ruff)
        if: steps.changed-files.outputs.pin_only != 'true'
        # The validation gate. Config lives in pyproject.toml; 0 findings is
        # the bar. This step is the hard gate that blocks merge on regression.
        run: |
          pip install ruff
          ruff check .
          ruff format --check .
      - name: Type check (pyright, non-blocking)
        if: steps.changed-files.outputs.pin_only != 'true'
        # Informational for now. Drop the `|| true` to hard-fail once the
        # codebase is clean against pyright.
        run: |
          pip install pyright
          pyright || true
      - name: Lint shell (shellcheck, non-blocking)
        if: steps.changed-files.outputs.pin_only != 'true'
        # Informational until the .sh scripts are triaged to 0 findings, then
        # drop the `|| true` to make it a hard gate like ruff.
        run: shellcheck $(git ls-files '*.sh') || true

  test:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Pin-only PRs (a bump of .aislop/fork-commit, opened by the aislop fork's
      # sync-consumers workflow) don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (pin-only PR early exit)
        id: changed-files
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          PIN_ONLY=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$GITHUB_BASE_REF" ]; then
            if git fetch --depth=1 origin "$GITHUB_BASE_REF" 2>/dev/null; then
              CHANGED=$(git diff --name-only FETCH_HEAD HEAD 2>/dev/null || true)
              echo "Changed files vs $GITHUB_BASE_REF:"
              echo "$CHANGED"
              if [ "$CHANGED" = ".aislop/fork-commit" ]; then
                PIN_ONLY=true
              fi
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git fetch --depth=1 origin "$EVENT_BEFORE" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" 2>/dev/null || true)
              echo "Changed files ($EVENT_BEFORE..$EVENT_AFTER):"
              echo "$CHANGED"
              if [ "$CHANGED" = ".aislop/fork-commit" ]; then
                PIN_ONLY=true
              fi
            fi
          fi
          echo "pin_only=$PIN_ONLY" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.changed-files.outputs.pin_only != 'true'
        with:
          python-version: '3.11'
      - name: Install optional runtime deps
        if: steps.changed-files.outputs.pin_only != 'true'
        # psutil is import-guarded in statusline_lib, but installing it lets the
        # suite exercise the real process-enumeration path instead of the mtime
        # fallback. coverage powers the 100% line-coverage gate below.
        run: pip install psutil coverage
      - name: Run verification scripts (coverage-gated)
        if: steps.changed-files.outputs.pin_only != 'true'
        # Run every scripts/verify_*.py under coverage; collect failures so one
        # bad script doesn't mask the others. statusline_lib is held at 100%
        # line coverage (reached 2026-06-10; see TEST-REPORT.md) -- the report
        # step fails the job on any uncovered line, same as a test failure.
        run: |
          fail=0
          for t in scripts/verify_*.py; do
            echo "=== $t ==="
            python -m coverage run -a "$t" || fail=1
          done
          python -m coverage report -m --include="statusline_lib/*" --fail-under=100 || fail=1
          # Emit coverage.json (statusline_lib scope, matching the gate above) for
          # the pr-crew/coverage status post below. Generated even when the gate
          # fails so pr-crew reads the real number, not a missing status.
          python -m coverage json --include="statusline_lib/*" -o coverage.json || fail=1
          exit $fail

      - name: Post pr-crew/coverage status
        # Posts the measured percent as a Gitea commit status (context
        # pr-crew/coverage) that pr-crew's coverage gate reads. Runs on every
        # event including failure (if: always()) so the status always reflects
        # the latest run; the helper posts state=error if coverage.json is
        # missing. Only the Linux job posts to avoid double-posting the same SHA.
        if: always() && steps.changed-files.outputs.pin_only != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/post-coverage-status.py

  test-windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Force UTF-8 so the statusline's glyphs (yin-yang, arrows, dots) don't trip
      # UnicodeEncodeError on the Windows console's cp1252 codepage.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      # Pin-only PRs (a bump of .aislop/fork-commit, opened by the aislop fork's
      # sync-consumers workflow) don't touch anything this job builds or tests.
      # Detect that case and skip the rest of the job's steps (still SUCCESS,
      # not skipped-as-failure, so branch protection's required check is
      # satisfied) instead of paying for a full build+test cycle. Never use
      # workflow-level paths/paths-ignore for this: on Gitea that leaves the
      # required check permanently pending for any PR that doesn't touch the
      # matched paths (gitea issue 36895).
      - name: Determine changed files (pin-only PR early exit)
        id: changed-files
        shell: pwsh
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          $pinOnly = $false
          try {
            if ($env:GITHUB_EVENT_NAME -eq "pull_request" -and $env:GITHUB_BASE_REF) {
              git fetch --depth=1 origin $env:GITHUB_BASE_REF 2>$null
              if ($LASTEXITCODE -eq 0) {
                $changed = @(git diff --name-only FETCH_HEAD HEAD 2>$null)
                Write-Host "Changed files vs $($env:GITHUB_BASE_REF):"
                $changed | ForEach-Object { Write-Host $_ }
                if ($changed.Count -eq 1 -and $changed[0] -eq ".aislop/fork-commit") {
                  $pinOnly = $true
                }
              }
            } elseif ($env:GITHUB_EVENT_NAME -eq "push" -and $env:EVENT_BEFORE -and $env:EVENT_BEFORE -ne "0000000000000000000000000000000000000000") {
              git fetch --depth=1 origin $env:EVENT_BEFORE 2>$null
              if ($LASTEXITCODE -eq 0) {
                $changed = @(git diff --name-only $env:EVENT_BEFORE $env:EVENT_AFTER 2>$null)
                Write-Host "Changed files ($($env:EVENT_BEFORE)..$($env:EVENT_AFTER)):"
                $changed | ForEach-Object { Write-Host $_ }
                if ($changed.Count -eq 1 -and $changed[0] -eq ".aislop/fork-commit") {
                  $pinOnly = $true
                }
              }
            }
          } catch {
            Write-Host "Changed-file detection failed, running the job in full: $_"
            $pinOnly = $false
          }
          "pin_only=$($pinOnly.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Python 3.11 (python-build-standalone)
        if: steps.changed-files.outputs.pin_only != 'true'
        # setup-python@v5 and the python.org MSI both fail under the SYSTEM-account
        # WinSW runner (WOW64 path redirection / SYSTEM ACLs break registration);
        # the portable tarball just unpacks with the runner's tar.exe. See local-ci
        # docs/project-ci-setup.md "Python install on the Windows runner".
        shell: pwsh
        run: |
          $pyDir = "C:\hostedtoolcache\Python311"
          if (-not (Test-Path "$pyDir\python.exe")) {
            $url = "https://github.com/astral-sh/python-build-standalone/releases/download/20260414/cpython-3.11.15+20260414-x86_64-pc-windows-msvc-install_only.tar.gz"
            $tar = Join-Path $env:RUNNER_TEMP "python-3.11.tar.gz"
            Invoke-WebRequest -Uri $url -OutFile $tar -UseBasicParsing
            New-Item -ItemType Directory -Force -Path $pyDir | Out-Null
            tar -xzf $tar -C $pyDir --strip-components=1
            if (-not (Test-Path "$pyDir\python.exe")) {
              throw "tar extracted but python.exe not at $pyDir\python.exe"
            }
          }
          & "$pyDir\python.exe" --version
          "$pyDir"         | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$pyDir\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install optional runtime deps
        if: steps.changed-files.outputs.pin_only != 'true'
        # psutil exercises the real process-enumeration path in the active-session
        # check instead of the mtime fallback (matches the Linux test job).
        # coverage powers the 100% line-coverage gate below.
        # python -m pip, not bare pip: python-build-standalone install_only
        # Windows archives ship pip as a module only (Scripts\ holds a single
        # .empty placeholder, no pip.exe shim), so bare `pip` fails on any
        # freshly provisioned runner (2026-07-16, first run on the chonkers box).
        shell: pwsh
        run: python -m pip install psutil coverage

      - name: Check syntax (py_compile)
        if: steps.changed-files.outputs.pin_only != 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem statusline_lib/*.py | ForEach-Object { $_.FullName }
          $files += 'statusline.py', 'subagent_statusline.py', 'install.py', 'wrap_nudge.py'
          python -m py_compile @files

      - name: Run verification scripts (coverage-gated)
        if: steps.changed-files.outputs.pin_only != 'true'
        # The same scripts/verify_*.py suite the Linux job runs, on Windows,
        # under the same 100% statusline_lib line-coverage gate (platform
        # branches must be covered on BOTH OSes -- tests patch os.name to force
        # the foreign arm).
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem scripts/verify_*.py | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python -m coverage run -a $_.FullName
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          python -m coverage report -m --include="statusline_lib/*" --fail-under=100
          if ($LASTEXITCODE -ne 0) { $fail = 1 }
          exit $fail
